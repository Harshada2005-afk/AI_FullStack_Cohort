<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            
        }

        .hero_section1{
            background: url(images/tanshiq.webp) no-repeat center center/cover;
            height: 700px;
            width: 100%;
            float: left;
            

            /* margin-top: 50px; */
        }

        .hero_section2{
            background-color: rgba(252, 237, 237, 0.8);
            height: 700px;
            width: 100%;
            display: flex;
            justify-content: center;  
            align-items: center;
        }
        .image{
            height: 400px;
            width: 400px;
            /* background: url(images/ring.png) no-repeat center center/cover; */
             background: url(images/model-1\ tanq.jpg) no-repeat center center/cover; 
            background-color: rgb(200, 208, 213);
            margin-left: 100px;
            border-radius: 20px;
            /* margin-top: 180px; */
        }

        .image img{
            margin-top: 25px;
            color: black;
        }

        .image h2{
            text-align: center;
            line-height: 30px;
             color: black;
        }

        .image p{
            text-align: center;
            line-height: 20px;
            color: black;
        }

        .image button{
            padding: 10px 20px;
            margin-left: 120px;
            border-radius: 10px;
            border: none;
        }

        /* .image1{
            margin-top: 100px;
        } */
    </style>
</head>
<body>
    <section class="hero_section1">
        <div class="hero_section2">
            <div class="image">
                    <img style="height: 100px; width: 100px; margin-left: 150px;" src="images/tq-logo.png" alt="">
                    <br> <br>
                    <h2>Your Special day is Around the Corner?</h2>
                    <br>
                    <p>If your birthday or anniversary is coming up, you <br>could unlock a discount of <b> upto 10%.</b>T&C Applied</p>
                    <br>
                    <button><b>Find My Discount</b> </button>
            </div>
        </div>
    </section>
    </main>
</body>
</html>
