<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meter to Kilometer Conversion</title>
</head>
<body>
  <h1>Meter to Kilometer Conversion</h1>
  <hr>

  <label for="meterInput">Enter value in meters:</label>
  <input type="number" id="meterInput" placeholder="Enter meters">
  <br><br>

  <button onclick="convertToKilometer()">Convert to Kilometer</button>
 
  <h2 id="result">Result will appear here</h2>

  <script>
    function convertToKilometer() {
      let meters = document.getElementById("meterInput").value;
      if (meters === "" || isNaN(meters)) {
        alert("Please enter a valid number");
        return;
      }
      let kilometer = meters / 1000;
      document.getElementById("result").innerText =
        meters + " meters = " + kilometer + " kilometers";
    }

  </script>
</body>
</html>
